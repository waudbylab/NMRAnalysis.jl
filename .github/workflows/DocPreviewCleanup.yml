# Delete a pull request's documentation preview once it is closed, so that
# gh-pages does not accumulate a `previews/PR<number>` folder per PR.
name: Doc preview cleanup

on:
  pull_request:
    types: [closed]

concurrency:
  group: doc-preview-cleanup
  cancel-in-progress: false

jobs:
  doc-preview-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      # Squashing the branch, as the Documenter template does, keeps gh-pages from growing
      # a commit per preview. It rewrites history, so it runs only when there is actually a
      # preview to remove.
      - name: Delete the preview and push
        run: |
          if [ ! -d "previews/PR$PRNUM" ]; then
            echo "no preview for PR$PRNUM"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf "previews/PR$PRNUM"
          git commit -m "delete preview PR$PRNUM"
          git branch gh-pages-new "$(echo "delete history" | git commit-tree HEAD^{tree})"
          git push --force origin gh-pages-new:gh-pages
        env:
          PRNUM: ${{ github.event.number }}
